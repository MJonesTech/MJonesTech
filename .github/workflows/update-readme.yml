name: Update README with Recent Projects

on:
  schedule:
    - cron: "0 0 * * *"
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ github.token }}

      - name: Get User Stats
        id: stats
        run: |
          stats_json=$(gh api graphql -F username="MJonesTech" -f query='
            query($username: String!) {
              user(login: $username) {
                repositories(first: 100, ownerAffiliations: OWNER, privacy: PUBLIC) {
                  totalCount
                  nodes {
                    stargazerCount
                    defaultBranchRef {
                      target {
                        ... on Commit {
                          history {
                            totalCount
                          }
                        }
                      }
                    }
                  }
                }
                followers {
                  totalCount
                }
                following {
                  totalCount
                }
                contributionsCollection {
                  totalCommitContributions
                  totalPullRequestContributions
                  totalRepositoryContributions
                }
              }
            }
          ' --jq '{
            repos: .data.user.repositories.totalCount,
            stars: ([.data.user.repositories.nodes[] | .stargazerCount] | if length > 0 then add else 0 end),
            followers: .data.user.followers.totalCount,
            following: .data.user.following.totalCount,
            commits: ([.data.user.repositories.nodes[] | .defaultBranchRef.target.history.totalCount] | if length > 0 then add else 0 end),
            prs: .data.user.contributionsCollection.totalPullRequestContributions,
            contributions: .data.user.contributionsCollection.totalRepositoryContributions
          }')

          {
            echo "stats<<EOF"
            echo "$stats_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Get Recent Public Repos
        id: repos
        run: |
          repos_json=$(gh api graphql -F username="MJonesTech" -f query='
            query($username: String!) {
              user(login: $username) {
                repositories(first: 5, orderBy: {field: UPDATED_AT, direction: DESC}, ownerAffiliations: OWNER, privacy: PUBLIC) {
                  nodes {
                    name
                    description
                    url
                    stargazerCount
                    primaryLanguage {
                      name
                    }
                  }
                }
              }
            }
          ' --jq '.data.user.repositories.nodes[:5]')

          {
            echo "repos<<EOF"
            echo "$repos_json" | jq -r '.[] | "- [**[\(.name)](\(.url))]** - \(.description // "No description")\n  - Language: \(.primaryLanguage.name // "N/A") | Stars: \(.stargazerCount)"'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update README
        run: |
          cat > /tmp/stats.jq << 'EOFJQ'
            "| Metric | Count |\n|--------|-------|\n" +
            "| Public Repos | " + (.repos | tostring) + " |\n" +
            "| Stars | " + (.stars | tostring) + " |\n" +
            "| Followers | " + (.followers | tostring) + " |\n" +
            "| Following | " + (.following | tostring) + " |\n" +
            "| Total Commits | " + (.commits | tostring) + " |\n" +
            "| PRs | " + (.prs | tostring) + " |"
          EOFJQ
          
          STATS_TABLE=$(echo '${{ steps.stats.outputs.stats }}' | jq -rf /tmp/stats.jq)
          
          {
            echo "## Hi there 👋"
            echo ""
            echo "I'm M Jones - just a guy who likes making cool things."
            echo ""
            echo "- 🔧 Building stuff and learning as I go"
            echo "- 📍 Based in the UK (London GMT/BST)"
            echo "- 💡 Open to collaborate on interesting projects"
            echo ""
            echo "---"
            echo ""
            echo "### 📊 GitHub Stats"
            echo ""
            echo "$STATS_TABLE"
            echo ""
            echo "---"
            echo ""
            echo "### 🚀 Recent Projects"
            echo ""
            echo "${{ steps.repos.outputs.repos }}"
            echo ""
            echo "---"
            echo ""
            echo "Feel free to check out my work and reach out if you'd like to connect!"
          } > README.md

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || git commit -m "Update recent projects in README"
          git push