name: Update README with Recent Projects

on:
  schedule:
    - cron: "0 0 * * *"
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Generate metrics
        uses: lowlighter/metrics@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: MJonesTech
          template: classic
          plugins: base,calendar,languages,commits
          base: repositories,followers

      - name: Get Recent Public Repos
        id: repos
        run: |
          repos_json=$(gh api graphql -F username="MJonesTech" -f query='
            query($username: String!) {
              user(login: $username) {
                repositories(first: 5, orderBy: {field: UPDATED_AT, direction: DESC}, ownerAffiliations: OWNER, privacy: PUBLIC) {
                  nodes {
                    name
                    description
                    url
                    stargazerCount
                    primaryLanguage {
                      name
                    }
                  }
                }
              }
            }
          ' --jq '.data.user.repositories.nodes[:5]')

          {
            echo "repos<<EOF"
            echo "$repos_json" | jq -r '.[] | "- [**[\(.name)](\(.url))]** - \(.description // "No description")\n  - Language: \(.primaryLanguage.name // "N/A") | Stars: \(.stargazerCount)"'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update README
        run: |
          mkdir -p assets
          mv *.svg assets/ 2>/dev/null || true
          {
            echo "## Hi there 👋"
            echo ""
            echo "I'm M Jones - just a guy who likes making cool things."
            echo ""
            echo "- 🔧 Building stuff and learning as I go"
            echo "- 📍 Based in the UK (London GMT/BST)"
            echo "- 💡 Open to collaborate on interesting projects"
            echo ""
            echo "---"
            echo ""
            echo "### 📊 GitHub Stats"
            echo ""
            echo "![GitHub Stats](./assets/metrics.svg)"
            echo ""
            echo "---"
            echo ""
            echo "### 🚀 Recent Projects"
            echo ""
            echo "${{ steps.repos.outputs.repos }}"
            echo ""
            echo "---"
            echo ""
            echo "Feel free to check out my work and reach out if you'd like to connect!"
          } > README.md

      - name: Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md assets/metrics.svg
          git diff --staged --quiet || git commit -m "Update recent projects and stats in README"
          git push